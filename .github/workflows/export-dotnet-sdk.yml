name: Export .NET 10 Linux SDK
on:
  push:
    branches: [nova-031-inventory-ci]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Warm Nova NuGet dependencies
        shell: bash
        run: |
          mkdir -p /tmp/nova-deps
          cat > /tmp/nova-deps/deps.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.Data.Sqlite" Version="10.0.12" />
              <PackageReference Include="SQLitePCLRaw.bundle_e_sqlite3" Version="3.0.5" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore /tmp/nova-deps/deps.csproj
      - name: Package compact SDK
        shell: bash
        run: |
          mkdir -p payload/dotnet payload/nuget
          cp "$DOTNET_ROOT/dotnet" payload/dotnet/
          cp -a "$DOTNET_ROOT/host" payload/dotnet/
          mkdir -p payload/dotnet/sdk payload/dotnet/shared payload/dotnet/packs
          cp -a "$DOTNET_ROOT/sdk/10.0.401" payload/dotnet/sdk/
          cp -a "$DOTNET_ROOT/shared/Microsoft.NETCore.App" payload/dotnet/shared/
          cp -a "$DOTNET_ROOT/packs/Microsoft.NETCore.App.Ref" payload/dotnet/packs/
          for p in microsoft.data.sqlite microsoft.data.sqlite.core sqlitepclraw.bundle_e_sqlite3 sqlitepclraw.core sqlitepclraw.provider.e_sqlite3 sqlitepclraw.lib.e_sqlite3; do
            if [ -d "$HOME/.nuget/packages/$p" ]; then cp -a "$HOME/.nuget/packages/$p" payload/nuget/; fi
          done
          tar -czf dotnet-nova-ci.tar.gz -C payload .
          sha256sum dotnet-nova-ci.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-nova-ci
          path: dotnet-nova-ci.tar.gz
          retention-days: 1
