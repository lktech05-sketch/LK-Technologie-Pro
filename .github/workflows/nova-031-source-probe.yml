name: Nova 0.31 Source Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch archived source branch
        shell: pwsh
        run: |
          git fetch origin nova-runtime-fix-0303 --depth=1
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch source branch" }
      - name: Source probe is retained for manual diagnostics
        shell: pwsh
        run: |
          Write-Host "Use the completed probe artifact from run 39676958307."
