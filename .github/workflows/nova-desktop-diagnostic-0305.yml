name: Nova Desktop Diagnostic 0.30.5
on:
  push:
    branches:
      - nova-desktop-diag-0305
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Rehydrate verified Nova source
        shell: pwsh
        run: |
          $parts = 0..5 | ForEach-Object {
            $name = "ci/nova-runtime-0303/src.clean.part{0:D2}" -f $_
            if (-not (Test-Path $name)) { throw "Missing source chunk: $name" }
            Get-Item $name
          }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          $sha = [BitConverter]::ToString([Security.Cryptography.SHA256]::HashData($bytes)).Replace('-','').ToLowerInvariant()
          if ($sha -ne "edea311b089a0758cec81b7838c7e9a467bcbf3c7533a63777de6c2c088ae6f3") { throw "Source SHA256 mismatch: $sha" }
          $archive = Join-Path $env:RUNNER_TEMP "nova-src.tar.xz"
          [IO.File]::WriteAllBytes($archive, $bytes)
          $src = Join-Path $env:RUNNER_TEMP "nova-src"
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          tar -xf $archive -C $src
          if ($LASTEXITCODE -ne 0) { throw "Source extraction failed" }
          "NOVA_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Patch real desktop crash diagnostics
        shell: pwsh
        run: |
          $appB64 = ""
          [IO.File]::WriteAllBytes((Join-Path $env:NOVA_SRC "src\Nova.Desktop\App.xaml.cs"), [Convert]::FromBase64String($appB64))
          $shell = Join-Path $env:NOVA_SRC "src\Nova.Desktop\Shell.cs"
          $text = Get-Content $shell -Raw
          $text = $text.Replace("Preview 0.30.0","Preview 0.30.5").Replace("PREVIEW · 0.30.0","PREVIEW · 0.30.5")
          Set-Content $shell $text -Encoding utf8
      - name: Build and publish Desktop + Launcher
        shell: pwsh
        run: |
          Push-Location $env:NOVA_SRC
          dotnet build LK-Nova.slnx -c Release
          if ($LASTEXITCODE -ne 0) { throw "solution build failed" }
          $win = Join-Path $env:NOVA_SRC "artifacts\windows"
          New-Item -ItemType Directory -Force -Path (Join-Path $win "app") | Out-Null
          dotnet publish src/Nova.Desktop -c Release -r win-x64 --self-contained true -o (Join-Path $win "app")
          if ($LASTEXITCODE -ne 0) { throw "desktop publish failed" }
          dotnet publish src/Nova.Launcher -c Release -r win-x64 --self-contained true -o (Join-Path $win "app")
          if ($LASTEXITCODE -ne 0) { throw "launcher publish failed" }
          python scripts/prepare_print_runtime.py
          if ($LASTEXITCODE -ne 0) { throw "print runtime preparation failed" }
          Copy-Item START_NOVA.cmd,START_NOVA_STOCK.cmd $win -Force
          Copy-Item README_AR.md (Join-Path $win "LIRE_MOI_AR.txt") -Force
          Copy-Item docs (Join-Path $win "docs") -Recurse -Force
          Copy-Item design (Join-Path $win "design") -Recurse -Force
          Pop-Location
      - name: Publish single-file self-contained server
        shell: pwsh
        run: |
          $server = Join-Path $env:NOVA_SRC "artifacts\windows\server"
          if (Test-Path $server) { Remove-Item $server -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $server | Out-Null
          dotnet publish (Join-Path $env:NOVA_SRC "src\Nova.Server\Nova.Server.csproj") -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o $server
          if ($LASTEXITCODE -ne 0) { throw "server single-file publish failed" }
          if (-not (Test-Path (Join-Path $server "Nova.Server.exe"))) { throw "Nova.Server.exe missing" }
          if (Test-Path (Join-Path $server "Nova.Core.dll")) { throw "Nova.Core.dll must not be loose" }
          if (Test-Path (Join-Path $server "Nova.Data.dll")) { throw "Nova.Data.dll must not be loose" }
      - name: Windows server and WPF startup smoke test
        shell: pwsh
        run: |
          $win = Join-Path $env:NOVA_SRC "artifacts\windows"
          $server = Join-Path $win "server\Nova.Server.exe"
          $desktop = Join-Path $win "app\LK Nova.exe"
          $oldLocal = $env:LOCALAPPDATA
          $testLocal = Join-Path $env:RUNNER_TEMP "NovaDesktopLocal"
          if (Test-Path $testLocal) { Remove-Item $testLocal -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $testLocal | Out-Null
          $env:LOCALAPPDATA = $testLocal
          $serverOut = Join-Path $env:RUNNER_TEMP "server.stdout.log"
          $serverErr = Join-Path $env:RUNNER_TEMP "server.stderr.log"
          $sp = Start-Process $server -ArgumentList @("--urls","http://127.0.0.1:5187","--Nova:Edition=Stock","--Nova:Demo=true") -PassThru -RedirectStandardOutput $serverOut -RedirectStandardError $serverErr
          $healthy = $false
          for ($i=0; $i -lt 80 -and -not $healthy; $i++) {
            Start-Sleep -Milliseconds 500
            if ($sp.HasExited) { break }
            try { $req = Invoke-WebRequest "http://127.0.0.1:5187/health" -UseBasicParsing -TimeoutSec 2; if ($req.StatusCode -eq 200) { $healthy = $true } } catch {}
          }
          if (-not $healthy) { Get-Content $serverOut -ErrorAction SilentlyContinue; Get-Content $serverErr -ErrorAction SilentlyContinue; throw "server did not become healthy" }
          $dp = Start-Process $desktop -PassThru
          Start-Sleep -Seconds 8
          $logs = @(Get-ChildItem (Join-Path $testLocal "LK Nova Preview\logs") -Filter "desktop-*.log" -ErrorAction SilentlyContinue)
          if ($logs.Count -gt 0) {
            $logs | ForEach-Object { Write-Host "--- $($_.FullName) ---"; Get-Content $_.FullName }
            if (-not $dp.HasExited) { Stop-Process -Id $dp.Id -Force }
            if (-not $sp.HasExited) { Stop-Process -Id $sp.Id -Force }
            throw "WPF startup generated a desktop crash log"
          }
          if ($dp.HasExited) { if (-not $sp.HasExited) { Stop-Process -Id $sp.Id -Force }; throw "LK Nova desktop exited during startup, code $($dp.ExitCode)" }
          Write-Host "DESKTOP_STARTUP_OK"
          Stop-Process -Id $dp.Id -Force
          if (-not $sp.HasExited) { Stop-Process -Id $sp.Id -Force }
          $env:LOCALAPPDATA = $oldLocal
      - name: Package full diagnostic Windows build
        shell: pwsh
        run: |
          $win = Join-Path $env:NOVA_SRC "artifacts\windows"
          @("LK Nova 0.30.5 diagnostic build","Server: single-file self-contained","Desktop: real exception logging enabled","Crash logs: %LOCALAPPDATA%\LK Nova Preview\logs\desktop-*.log") | Set-Content (Join-Path $win "DIAGNOSTIC_0305.txt") -Encoding utf8
          $zip = Join-Path $env:GITHUB_WORKSPACE "Nova_0.30.5_Windows_DIAGNOSTIC_FIX.zip"
          Compress-Archive -Path "$win\*" -DestinationPath $zip -Force
          Write-Host "ZIP_SHA256=$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())"
      - name: Upload full diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: Nova_0.30.5_Windows_DIAGNOSTIC_FIX
          path: Nova_0.30.5_Windows_DIAGNOSTIC_FIX.zip
          retention-days: 1
          if-no-files-found: error
