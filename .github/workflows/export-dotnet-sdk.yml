name: Export .NET 10 Linux SDK
on:
  push:
    branches: [nova-031-inventory-ci]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Warm Nova NuGet dependencies
        shell: bash
        run: |
          mkdir -p /tmp/nova-deps
          cat > /tmp/nova-deps/deps.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.Data.Sqlite" Version="10.0.12" />
              <PackageReference Include="SQLitePCLRaw.bundle_e_sqlite3" Version="3.0.5" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore /tmp/nova-deps/deps.csproj
          mkdir -p nuget
          for p in microsoft.data.sqlite microsoft.data.sqlite.core sqlitepclraw.bundle_e_sqlite3 sqlitepclraw.core sqlitepclraw.provider.e_sqlite3 sqlitepclraw.lib.e_sqlite3; do
            if [ -d "$HOME/.nuget/packages/$p" ]; then cp -a "$HOME/.nuget/packages/$p" nuget/; fi
          done
          tar -czf nova-nuget-cache.tar.gz nuget
      - name: Download official SDK archive
        shell: bash
        run: |
          curl -fL --retry 3 -o dotnet-sdk-10.0.401-linux-x64.tar.gz https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.401/dotnet-sdk-10.0.401-linux-x64.tar.gz
          sha256sum dotnet-sdk-10.0.401-linux-x64.tar.gz nova-nuget-cache.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-nova-ci
          path: |
            dotnet-sdk-10.0.401-linux-x64.tar.gz
            nova-nuget-cache.tar.gz
          compression-level: 0
          retention-days: 1
