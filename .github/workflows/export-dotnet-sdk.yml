name: Export Nova Windows Exact Build Cache
on:
  push:
    branches: [nova-031-inventory-ci]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Restore exact build packages
        shell: bash
        run: |
          mkdir -p /tmp/packs
          cat > /tmp/packs/packs.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageDownload Include="Microsoft.WindowsDesktop.App.Ref" Version="[10.0.12]" />
              <PackageDownload Include="System.IO.Ports" Version="[10.0.12]" />
              <PackageDownload Include="Microsoft.NETCore.App.Host.linux-x64" Version="[10.0.13]" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore /tmp/packs/packs.csproj
          mkdir -p /tmp/wpf
          cat > /tmp/wpf/wpf.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0-windows</TargetFramework>
              <UseWPF>true</UseWPF>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier>
              <RuntimeFrameworkVersion>10.0.12</RuntimeFrameworkVersion>
              <TargetLatestRuntimePatch>false</TargetLatestRuntimePatch>
            </PropertyGroup>
            <ItemGroup><PackageReference Include="System.IO.Ports" Version="10.0.12" /></ItemGroup>
          </Project>
          EOF
          echo 'public class Dummy {}' > /tmp/wpf/Class1.cs
          dotnet restore /tmp/wpf/wpf.csproj -r win-x64
      - name: Package cache
        shell: bash
        run: |
          mkdir -p cache
          for d in "$HOME/.nuget/packages/"*; do
            n="$(basename "$d")"
            case "$n" in
              *sqlite*|system.io.ports*|runtime.*system.io.ports*|microsoft.windowsdesktop.app.ref|microsoft.windowsdesktop.app.runtime.win-x64|microsoft.netcore.app.runtime.win-x64|microsoft.netcore.app.host.*|microsoft.aspnetcore.app.runtime.win-x64|microsoft.aspnetcore.app.ref)
                cp -a "$d" cache/
                ;;
            esac
          done
          tar -czf nova-win-build-cache.tar.gz cache
          du -h nova-win-build-cache.tar.gz
          sha256sum nova-win-build-cache.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nova-win-build-cache
          path: nova-win-build-cache.tar.gz
          compression-level: 0
          retention-days: 1
