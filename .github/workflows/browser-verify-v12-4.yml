name: Browser verification V12.4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/browser-verify-v12-4.yml']
  workflow_dispatch:
permissions: {}
jobs:
  chromium-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install pinned browser test tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Verify actual page interactions and download without executing installer
        shell: python
        run: |
          import hashlib,json,os,time
          from datetime import datetime,timezone
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          BASE='https://lktechnologie.com/'
          EXE='https://github.com/lktech05-sketch/LK-Technologie-Pro/releases/download/V12.4/LK_Technologie_Pro_V12_4_Setup.exe'
          NAME='LK_Technologie_Pro_V12_4_Setup.exe'
          HASH='9f1eb1d858004b7926737538d07f26716abdc5190e1f9fe092743b490ec0da7f'
          report={}; errors=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(accept_downloads=True,viewport={'width':1440,'height':1000})
              page=context.new_page();page.on('pageerror',lambda error: errors.append(str(error)))
              page.goto(BASE+'?browser_audit='+str(time.time_ns()),wait_until='domcontentloaded')
              page.wait_for_selector('meta[name="lk-windows-release"][content="12.4"]',state='attached')
              assert 'V12.4' in page.locator('.brand').inner_text()
              page.wait_for_function("document.querySelectorAll('#guides .lesson:not(.guide-hidden)').length===4")
              counts=[page.locator('#guides .lesson:visible').count()]
              page.locator('#guidesMoreBtn').click()
              counts.append(page.locator('#guides .lesson:visible').count())
              page.locator('#guidesMoreBtn').click()
              counts.append(page.locator('#guides .lesson:visible').count())
              assert counts==[4,8,9],counts
              assert page.locator('#guidesMoreBtn').is_hidden()
              report['guides_visible_counts']=counts;report['more_hidden_at_nine']=True
              banner=page.locator('#mobileHeroBanner');banner.scroll_into_view_if_needed()
              page.wait_for_function("document.getElementById('mobileHeroBanner').naturalWidth>0")
              assert banner.is_visible() and page.locator('.mobile-visual-fallback').is_hidden()
              report['banner']=banner.evaluate('(e)=>({src:e.currentSrc,width:e.naturalWidth,height:e.naturalHeight,display:getComputedStyle(e).display})')
              assert '1.0.25' in page.locator('.mobile-badge').inner_text()
              assert page.locator('[data-apk-link]').count()==2
              for a in page.locator('[data-apk-link]').all():
                  assert a.get_attribute('href')=='assets/mobile/LK_Technologie_Pro_Mobile_1_0_25.apk'
              report['android_version']='1.0.25'
              page.goto(BASE+'download-v12-4.html?browser_audit='+str(time.time_ns()),wait_until='domcontentloaded')
              link=page.locator('#downloadV124');assert link.is_visible()
              assert link.get_attribute('href')==EXE,link.get_attribute('href')
              assert 'En préparation' not in page.locator('body').inner_text()
              page.locator('#langBtn').click()
              assert page.locator('html').get_attribute('lang')=='ar' and page.locator('html').get_attribute('dir')=='rtl'
              assert 'تحميل' in link.inner_text()
              report['landing_arabic_rtl']='PASS'
              page.locator('#langBtn').click()
              assert page.locator('html').get_attribute('lang')=='fr' and page.locator('html').get_attribute('dir')=='ltr'
              assert 'Télécharger' in link.inner_text();report['landing_french_ltr']='PASS'
              page.goto(BASE+'?browser_download='+str(time.time_ns()),wait_until='domcontentloaded')
              homepage_link=page.locator('#download a[href*="download-v12-4.html"]').first
              assert homepage_link.get_attribute('href')=='download-v12-4.html?start=1'
              with page.expect_download(timeout=90000) as downloaded:
                  homepage_link.click()
              download=downloaded.value
              assert download.suggested_filename==NAME,download.suggested_filename
              downloaded_file=Path(download.path())
              assert download.failure() is None
              assert downloaded_file.stat().st_size==196113272
              with downloaded_file.open('rb') as f: actual_hash=hashlib.file_digest(f,'sha256').hexdigest()
              assert actual_hash==HASH,actual_hash
              report['download']={'observed':True,'completed':True,'filename':download.suggested_filename,'size_bytes':downloaded_file.stat().st_size,'sha256':actual_hash,'hash_matches':True,'started_from_official_homepage':True,'executed':False}
              assert not errors,errors
              report.update({'result':'PASS','javascript_page_errors':errors,'checked_at_utc':datetime.now(timezone.utc).isoformat(),'browser':browser.version})
              browser.close()
          print('LK_BROWSER_AUDIT_BEGIN');print(json.dumps(report,ensure_ascii=False,indent=2));print('LK_BROWSER_AUDIT_END')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'w',encoding='utf-8') as f:
              f.write('## V12.4 Chromium verification\n\n```json\n'+json.dumps(report,ensure_ascii=False,indent=2)+'\n```\n')
