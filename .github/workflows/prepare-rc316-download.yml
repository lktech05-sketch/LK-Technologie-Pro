name: Verify and prepare Windows RC3.16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-rc316-download.yml']
  workflow_dispatch:
permissions: {}
jobs:
  verify-and-prepare:
    runs-on: windows-latest
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - name: Download and inspect the installer without executing it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://github.com/lktech05-sketch/LK-Technologie-Pro/releases/download/V12.4/LK_Technologie_Pro_V12_4_RC3_16_Setup.exe'
          $expectedHash = '7c4f376fa03acd1d0ad221d8ce3b1b5b5a3fb783a4ff288cd5bfa44737f7e848'
          $expectedSize = [long]196588836
          $asset = Invoke-RestMethod -Uri 'https://api.github.com/repos/lktech05-sketch/LK-Technologie-Pro/releases/assets/584721037' -Headers @{Accept='application/vnd.github+json'}
          if ($asset.name -ne 'LK_Technologie_Pro_V12_4_RC3_16_Setup.exe' -or $asset.size -ne $expectedSize -or $asset.digest -ne "sha256:$expectedHash" -or $asset.state -ne 'uploaded' -or $asset.browser_download_url -ne $url) { throw 'Unexpected release asset metadata' }
          $file = Join-Path $env:RUNNER_TEMP 'verified-rc316.exe'
          & curl.exe --fail --location --silent --show-error --connect-timeout 20 --max-time 180 --output $file $url
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          $item = Get-Item -LiteralPath $file
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($item.Length -ne $expectedSize -or $hash -ne $expectedHash) { throw 'Installer integrity mismatch' }
          $reader = [System.IO.BinaryReader]::new([System.IO.File]::OpenRead($file))
          try {
            if ($reader.ReadUInt16() -ne 0x5a4d) { throw 'Invalid MZ header' }
            $reader.BaseStream.Position = 0x3c
            $offset = $reader.ReadUInt32()
            if ($offset -gt ($item.Length - 6)) { throw 'Invalid PE offset' }
            $reader.BaseStream.Position = $offset
            if ($reader.ReadUInt32() -ne 0x4550) { throw 'Invalid PE header' }
          } finally { $reader.Dispose() }
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($file)
          if ($version.FileVersion.Trim() -ne '12.4.0.0' -or $version.ProductName.Trim() -ne 'LK.Technologie Pro V12.4') { throw 'Unexpected product or installer version' }
          $signature = Get-AuthenticodeSignature -LiteralPath $file
          $report = [ordered]@{checked_at_utc=[DateTime]::UtcNow.ToString('o');asset_id=584721037;filename=$asset.name;asset_url=$url;size_bytes=$item.Length;sha256=$hash;file_version=$version.FileVersion.Trim();product_version=$version.ProductVersion.Trim();product_name=$version.ProductName.Trim();authenticode_status=$signature.Status.ToString();download_completed=$true;hash_matches=$true;windows_pe_header_valid=$true;installer_executed=$false;payload_build_identity_verified=$false;shop_functional_tests_performed_in_this_check=$false}
          $report | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'rc316-verification.json') -Encoding utf8
          Write-Output 'LK_RC316_STATIC_BEGIN'
          $report | ConvertTo-Json | Write-Output
          Write-Output 'LK_RC316_STATIC_END'
      - name: Prepare strictly scoped website objects without publishing or modifying release assets
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, html, json, os, re
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          REPO='lktech05-sketch/LK-Technologie-Pro';API='https://api.github.com/repos/'+REPO
          HEAD=os.environ['GITHUB_SHA'];assert os.environ['GITHUB_REPOSITORY']==REPO
          OLD='LK_Technologie_Pro_V12_4_RC3_15_Setup.exe';NEW='LK_Technologie_Pro_V12_4_RC3_16_Setup.exe'
          OLD_HASH='2ef88c041b4cbed1a69fce8b40c0880f10d2de2e6becb08768cb089061957835'
          SHA='7c4f376fa03acd1d0ad221d8ce3b1b5b5a3fb783a4ff288cd5bfa44737f7e848';SIZE=196588836
          URL='https://github.com/'+REPO+'/releases/download/V12.4/'+NEW
          def api(path,method='GET',data=None):
              headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'LK-RC316-publication','X-GitHub-Api-Version':'2022-11-28'}
              body=None if data is None else json.dumps(data).encode()
              if body is not None:headers['Content-Type']='application/json'
              with urlopen(Request(API+path,data=body,headers=headers,method=method),timeout=40) as response:return json.load(response)
          expected_blobs={'index.html':'eb6d772ba22b5314dde22588a92e83d5386f22b2','download-v12-4.html':'32d9bef32a6ae6f3f97b0aa158f0dc0ed0945c55','_includes/windows-v12-4-features.html':'c11974d9b37329fe094429a4e9f48d0eab9da664','updates/update.json':'2303321a222e121092d0bf0f529abb356cba0b2f'}
          def read(path):
              data=api('/contents/'+quote(path,safe='/')+'?ref='+HEAD)
              assert data['sha']==expected_blobs[path] and data['encoding']=='base64','File changed since review: '+path
              return base64.b64decode(data['content']).decode('utf-8')
          def change(text,old,new):
              assert old in text,'Missing reviewed text: '+old[:80]
              return text.replace(old,new)
          def bilingual(fr,ar,attrs):
              return '<p '+attrs+' data-fr="'+html.escape(fr,quote=True)+'" data-ar="'+html.escape(ar,quote=True)+'">'+html.escape(fr)+'</p>'
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'rc316-verification.json').read_text(encoding='utf-8-sig'))
          assert report['hash_matches'] and report['sha256']==SHA and report['size_bytes']==SIZE
          assert report['authenticode_status']=='NotSigned','Review signature wording before publishing'
          release=api('/releases/tags/V12.4')
          assert release['id']==394794209 and not release['draft'] and not release['prerelease']
          asset=next(a for a in release['assets'] if a['id']==584721037)
          assert asset['digest']=='sha256:'+SHA and asset['size']==SIZE and asset['name']==NEW
          assert {584543573,584171689}.issubset({a['id'] for a in release['assets']}),'Prior installers must be retained'
          report['old_installers_retained']=True
          changes={}
          landing=read('download-v12-4.html')
          for old,new in [(OLD,NEW),(OLD_HASH,SHA),('196 134 490','196 588 836'),('196,134,490','196,588,836'),('196,13 Mo','196,59 Mo'),('196.13 MB','196.59 MB')]:landing=change(landing,old,new)
          build_notice=bilingual('Correctif RC3.16 : routage des paiements mobiles BaridiMob, CCP et banque, suivi des règlements et compensations, soldes des reçus de retour. Les correctifs Multicode et attente d’activation sont conservés.','تصحيح RC3.16: توجيه دفعات الهاتف إلى حساب BaridiMob أو CCP أو البنك، توثيق التسديدات والمقاصة وتصحيح أرصدة وصول المرتجع، مع الاحتفاظ بتصحيحات Multicode وانتظار التفعيل.','id="buildNotice" class="note"')
          landing,count=re.subn(r'<p id="buildNotice"[^>]*>.*?</p>',lambda match:build_notice,landing,flags=re.S)
          assert count==1
          landing=change(landing,'RC3.15','RC3.16')
          data_notice=bilingual('Important : l’installation corrige les nouvelles opérations, mais ne répare pas automatiquement les anciennes écritures. Une régularisation éventuelle doit être vérifiée séparément sur une sauvegarde récente ; ne répétez pas les ventes ou règlements.','مهم: التثبيت يصحح العمليات الجديدة، لكنه لا يعالج القيود القديمة تلقائيًا. أي معالجة سابقة تحتاج مراجعة منفصلة على نسخة احتياطية حديثة؛ لا تعِد عمليات البيع أو التسديد.','id="dataRepairNotice" class="note"')
          landing=change(landing,'    <details><summary',data_notice+'\n    <details><summary')
          assert OLD not in landing and OLD_HASH not in landing and 'RC3.15' not in landing
          assert 'Application Android 1.0.25' in landing
          changes['download-v12-4.html']=landing
          changes['index.html']=change(read('index.html'),'RC3.15','RC3.16')
          features=read('_includes/windows-v12-4-features.html')
          features=change(features,'Correctif RC3.15 disponible : Multicode pour le téléphone et amélioration de l’attente d’activation.','Correctif RC3.16 disponible : paiements mobiles, règlements, compensations et soldes des reçus. Les corrections Multicode, activation et réseau sont conservées.')
          features=change(features,'تصحيح RC3.15 متاح: دعم Multicode للهاتف وتحسين انتظار التفعيل.','تصحيح RC3.16 متاح: دفعات الهاتف، التسديدات، المقاصة وأرصدة الوصول، مع الحفاظ على تصحيحات Multicode والتفعيل والشبكة.')
          changes['_includes/windows-v12-4-features.html']=features
          manifest=json.loads(read('updates/update.json'))
          assert manifest['version']=='12.4' and manifest['build_id']=='RC3.15' and manifest['installer']['sha256']==OLD_HASH
          manifest['installer']={'url':URL,'size_bytes':SIZE,'sha256':SHA};manifest['build_id']='RC3.16'
          additions={
              'fr':'• Correctif RC3.16 : les paiements et remboursements mobiles sont dirigés vers le compte approprié, notamment BaridiMob, CCP et banque, sans les confondre avec les espèces.\n• Historique : documentation des versements initiaux sans double encaissement, affichage des compensations non monétaires et des remboursements existants.\n• Reçus de retour mobile : sauvegarde des soldes avant/après et correction du calcul des anciens reçus MRET concernés.\n• Les anciennes écritures ne sont pas régularisées automatiquement par l’installation. Leur traitement nécessite une sauvegarde récente et une vérification séparée.\n',
              'ar':'• تصحيح RC3.16: توجيه دفعات الهاتف واسترداداتها إلى الحساب الصحيح، بما فيه BaridiMob وCCP والبنك، دون احتسابها كنقد.\n• السجلات: توثيق الدفعات الأولية دون قبض مزدوج، وعرض المقاصة غير النقدية والاستردادات الموجودة.\n• وصول مرتجعات الهاتف: حفظ الرصيد قبل وبعد العملية وتصحيح حساب وصول MRET القديمة المعنية.\n• تثبيت التصحيح لا يعالج القيود القديمة تلقائيًا؛ معالجتها تحتاج نسخة احتياطية حديثة ومراجعة مستقلة.\n',
              'en':'• RC3.16: route mobile payments and refunds to the appropriate account, including BaridiMob, CCP and bank, rather than treating electronic payments as cash.\n• History: document initial payments without duplicate collection, and display non-cash offsets and existing refunds.\n• Mobile return receipts: save before/after balances and correct the calculation for affected older MRET receipts.\n• Installation does not automatically regularize old records. Historical corrections require a recent backup and separate review.\n'}
          for lang,prefix in additions.items():manifest['notes'][lang]=prefix+manifest['notes'][lang]
          assert manifest['minimum_version']=='12.2' and manifest['channel']=='stable'
          changes['updates/update.json']=json.dumps(manifest,ensure_ascii=False,indent=2)+'\n'
          changes['updates/rc3-16-verification.json']=json.dumps(report,ensure_ascii=False,indent=2)+'\n'
          assert set(changes)=={'index.html','download-v12-4.html','_includes/windows-v12-4-features.html','updates/update.json','updates/rc3-16-verification.json'}
          assert api('/git/ref/heads/main')['object']['sha']==HEAD,'Main changed; review again before publication'
          parent=api('/git/commits/'+HEAD)
          tree=api('/git/trees','POST',{'base_tree':parent['tree']['sha'],'tree':[{'path':path,'mode':'100644','type':'blob','content':text} for path,text in changes.items()]})
          print('LK_RC316_PREPARED_BEGIN')
          print(json.dumps({'parent_sha':HEAD,'tree_sha':tree['sha'],'changed_paths':list(changes),'verified_installer':report,'main_updated':False,'apk_links_changed':False,'same_version_update':'manual install; numerical version remains 12.4'},ensure_ascii=False,indent=2))
          print('LK_RC316_PREPARED_END')
