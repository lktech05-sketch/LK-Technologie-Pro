name: Browser verification V12.4 RC3.15
on:
  push:
    branches: [main]
    paths: ['.github/workflows/browser-verify-v12-4.yml']
  workflow_dispatch:
permissions: {}
jobs:
  chromium-check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install pinned browser test tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Verify live RC3.15 pages and completed browser download without executing installer
        shell: python
        run: |
          import hashlib,json,os,time
          from datetime import datetime,timezone
          from pathlib import Path
          from urllib.request import Request,urlopen
          from playwright.sync_api import sync_playwright
          BASE='https://lktechnologie.com/'
          NAME='LK_Technologie_Pro_V12_4_RC3_15_Setup.exe'
          EXE='https://github.com/lktech05-sketch/LK-Technologie-Pro/releases/download/V12.4/'+NAME
          HASH='2ef88c041b4cbed1a69fce8b40c0880f10d2de2e6becb08768cb089061957835'
          SIZE=196134490
          report={}; errors=[]
          def text(path):
              url=BASE+path+('' if '?' in path else '?')+'&audit='+str(time.time_ns())
              with urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=25) as r:
                  assert r.status==200
                  return r.read(1000000).decode('utf-8-sig')
          deadline=time.monotonic()+210
          while True:
              try:
                  home=text('');landing=text('download-v12-4.html');manifest=json.loads(text('updates/update.json'))
                  assert 'name="lk-windows-build" content="RC3.15"' in home
                  assert 'name="lk-windows-build" content="RC3.15"' in landing
                  assert manifest['build_id']=='RC3.15' and manifest['version']=='12.4'
                  assert manifest['installer']=={'url':EXE,'size_bytes':SIZE,'sha256':HASH}
                  assert NAME in landing and '196 134 490' in landing and HASH in landing
                  break
              except Exception:
                  if time.monotonic()>deadline: raise
                  time.sleep(10)
          assert manifest['channel']=='stable' and manifest['minimum_version']=='12.2'
          report['manifest']={'version':manifest['version'],'build_id':manifest['build_id'],'size_bytes':SIZE,'sha256':HASH,'url':EXE}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(accept_downloads=True,viewport={'width':1440,'height':1000})
              page=context.new_page();page.on('pageerror',lambda error:errors.append(str(error)))
              page.goto(BASE+'?build=RC3.15&audit='+str(time.time_ns()),wait_until='domcontentloaded')
              page.wait_for_selector('meta[name="lk-windows-build"][content="RC3.15"]',state='attached')
              assert 'RC3.15' in page.locator('.hero .badge').inner_text()
              page.wait_for_function("document.querySelectorAll('#guides .lesson:not(.guide-hidden)').length===4")
              counts=[page.locator('#guides .lesson:visible').count()]
              page.locator('#guidesMoreBtn').click();counts.append(page.locator('#guides .lesson:visible').count())
              page.locator('#guidesMoreBtn').click();counts.append(page.locator('#guides .lesson:visible').count())
              assert counts==[4,8,9] and page.locator('#guidesMoreBtn').is_hidden()
              report['guides_visible_counts']=counts
              banner=page.locator('#mobileHeroBanner');banner.scroll_into_view_if_needed()
              page.wait_for_function("document.getElementById('mobileHeroBanner').naturalWidth>0")
              assert banner.is_visible() and page.locator('.mobile-visual-fallback').is_hidden()
              report['banner_visible']=True
              page.wait_for_function("[...document.querySelectorAll('[data-apk-link]')].every(a=>a.getAttribute('aria-disabled')==='false')")
              assert page.locator('[data-apk-link]').count()==2
              for a in page.locator('[data-apk-link]').all():
                  assert a.get_attribute('href')=='assets/mobile/LK_Technologie_Pro_Mobile_1_0_25.apk'
              report['android_version']='1.0.25'
              page.goto(BASE+'download-v12-4.html?audit='+str(time.time_ns()),wait_until='domcontentloaded')
              link=page.locator('#downloadV124')
              assert link.is_visible() and link.get_attribute('href')==EXE
              assert 'RC3.15' in page.locator('#buildNotice').inner_text()
              assert page.locator('#sameVersionNotice').is_visible()
              page.locator('#langBtn').click()
              assert page.locator('html').get_attribute('lang')=='ar' and page.locator('html').get_attribute('dir')=='rtl'
              assert 'تحميل' in link.inner_text()
              assert 'RC3.15' in page.locator('#sameVersionNotice').inner_text()
              page.locator('#langBtn').click()
              assert page.locator('html').get_attribute('lang')=='fr'
              report['landing_languages']='FR/AR/RTL PASS'
              page.set_viewport_size({'width':390,'height':844})
              assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
              report['landing_390px_no_overflow']=True
              page.set_viewport_size({'width':1440,'height':1000})
              page.goto(BASE+'?browser_download='+str(time.time_ns()),wait_until='domcontentloaded')
              homepage_link=page.locator('#download a[href*="download-v12-4.html"]').first
              assert homepage_link.get_attribute('href')=='download-v12-4.html?start=1'
              with page.expect_download(timeout=90000) as downloaded:
                  homepage_link.click()
              download=downloaded.value
              assert download.suggested_filename==NAME,download.suggested_filename
              downloaded_file=Path(download.path());assert download.failure() is None
              assert downloaded_file.stat().st_size==SIZE
              with downloaded_file.open('rb') as f: actual_hash=hashlib.file_digest(f,'sha256').hexdigest()
              assert actual_hash==HASH
              report['download']={'completed':True,'filename':download.suggested_filename,'size_bytes':SIZE,'sha256':actual_hash,'started_from_official_homepage':True,'installer_executed':False}
              assert not errors,errors
              report.update(result='PASS',javascript_page_errors=errors,checked_at_utc=datetime.now(timezone.utc).isoformat(),browser=browser.version)
              browser.close()
          print('LK_RC315_BROWSER_BEGIN');print(json.dumps(report,ensure_ascii=False,indent=2));print('LK_RC315_BROWSER_END')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'w',encoding='utf-8') as f:
              f.write('## RC3.15 live download verification\n\n```json\n'+json.dumps(report,ensure_ascii=False,indent=2)+'\n```\n')
